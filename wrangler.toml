# Cloudflare Pages Configuration
name = "kbi"
compatibility_date = "2024-01-01"

# Build configuration
[build]
command = "npm run build"
cwd = "./"

# Site directory for `wrangler deploy` if used as a static upload.
# Note: Cloudflare Pages should use `wrangler pages deploy .next/standalone`
[site]
bucket = ".next/standalone"
