name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to Cloudflare Pages
        # Disabled actual wrangler deploy to avoid Worker binding errors (service binding to missing Worker).
        # Per request, we skip wrangler and rely on Cloudflare Pages to serve the built output (kbi.pages.dev).
        run: |
          echo "Skipping wrangler pages deploy as requested. Build completed and artifacts are in .next/standalone"
